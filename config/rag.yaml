# RAG pipeline configuration.
# Individual stages can be toggled/tuned without touching code.

chunking:
  # Select between "semantic" and "recursive".
  # "semantic" utilizes langchain_experimental's SemanticChunker.
  # "recursive" is the fixed-size splitter: much faster and needs no embedding model at build time. 
  # An unknown value aborts the build rather than falling back to a default.
  strategy: semantic
  # "semantic_threshold" is passed as breakpoint_threshold_amount with breakpoint_threshold_type="percentile" when using SemanticChunker.
  # Meaning: Within a document, consecutive sentences are embedded and the distance between each 
  # adjacent pair is computed. A new chunk boundary is inserted only where that distance
  # is at or above the given percentile of all distances observed in that document
  # - e.g. 80 means only the most surprising 20% of sentence-to-sentenc etopic shifts
  # become chunk boundaries. Higher values produce fewer, larger chunks.
  semantic_threshold: 80
  # "chunk_size" and "chunk_overlap " are used only by the "recursive" strategy.
  chunk_size: 800
  chunk_overlap: 100

retrieval:
  strategy: hybrid
  dense_weight: 0.5
  sparse_weight: 0.5
  candidate_top_k: 30

generation:
  orchestration: stuff
  temperature: 0
  # Max times the pipeline will regenerate an answer that hallucination_check/policy_check flagged
  # (feeding the violation back to the LLM) before giving up and returning a fixed safe message.
  max_regenerations: 2

guardrails:
  # The baseline's only "security" mechanism: retrieval is scoped to the session's patient_id.
  # Not a guardrail per definition. It is part of the RAG pipline and ensures high response quality.
  # When set to false, the chatbot would mix up patients' documents and diagnoses --> significant drop of response quality
  patient_isolation: true
  # MedicationGuardrail (app/guardrails/medication.py):
  # Cross-checks any medication mentioned in the retrieved patient_context against the trusted
  # external knowledge base in data/drugs/drugs.yaml. When on, that reference (and any detected
  # dosage conflict) is added to the system prompt so the chatbot can flag poisoned/wrong data
  # and advise contacting the doctor. When off, the chatbot behaves as before.
  fact_check: false
  # JailbreakGuardrail (app/guardrails/jailbreak.py):
  # Guardrails AI's DetectJailbreak validator, run on the raw user message before it reaches the
  # RAG pipeline. On trigger the LLM is never called. The chatbot returns a fixed refusal instead.
  jailbreak_detection: false
  jailbreak_threshold: 0.725
  # Per-session flag-count -> permanent blacklist escalation on top of the per-message check above.
  # It is blind to attacks spread across many individually-unremarkable turns. That gap is covered
  # by trajectory_analysis below instead.
  jailbreak_strike_tracking: false
  jailbreak_blacklist_limit: 1
  # RagInjectionGuardrail: llm-semantic-router/toolcall-sentinel, a pretrained ModernBERT injection
  # classifier (see app/guardrails/rag_injection.py). Runs on the retrieved chunks before the
  # prompt is built. Any chunk scoring above threshold on the INJECTION_RISK label is dropped from
  # context (not a full turn refusal).
  rag_injection_detection: false
  rag_injection_threshold: 0.78
  # TrajectoryGuardrail (app/guardrails/trajectory.py): an LLM judge over the full conversation
  # transcript, run periodically (not every turn) and tracked via a decaying SessionRiskBudget
  # (app/guardrails/risk_budget.py). Catches slow-boil manipulation spread across many turns that
  # no single message reveals. Fail-closed: a judge-call/parse failure blocks the turn.
  trajectory_analysis: true
  # HallucinationGuardrail (app/guardrails/hallucination.py): an LLM judge checking every factual
  # claim in the drafted answer against the retrieved context. Runs inside the RAG pipeline after
  # generation. A flagged material claim triggers a regeneration (see generation.max_regenerations
  # above). Fail-closed.
  hallucination_check: false
  # PolicyGuardrail (app/guardrails/policy.py): an LLM judge checking the drafted answer against a
  # medical-conduct rubric (no new diagnosis, no dosage changes beyond the record, defer
  # emergencies, no cross-patient disclosure, no system-prompt leakage). Same regeneration/
  # fail-closed contract as hallucination_check.
  policy_check: false
